[project]
name = "python-linters"
version = "0.2.0"
description = "Run ruff, ty and pymodularity on a Python project and print one JSON report grouped by rule."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tilo Himmelsbach" }]
dependencies = [
    "ruff==0.17.3",
    "ty==0.0.90",
    "pymodularity==0.5.0",
]

[project.scripts]
python-linters = "python_linters.__main__:main"

[tool.deptry.per_rule_ignores]
# DEP002 (unused-dependency) false positive: deptry only sees `import` statements,
# but this package runs ruff, ty and pymodularity as `sys.executable -m <tool>`
# subprocesses, never `import`s them. All three are genuinely required at
# runtime for `python-linters lint` to work.
DEP002 = ["ruff", "ty", "pymodularity"]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
