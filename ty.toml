# ============================================================================
# ty Reference Configuration
# ============================================================================
#
# Canonical rule table for new Python projects. Every rule ty 0.0.103 knows is
# listed below, one line each, with no `all = "error"` base. Each line is
# "error" or "ignore". A "warn" setting is never used, because a warning
# does not fail a CI gate, so a green run hides it.
#
# Three sections: the ignored rules, each under a comment giving its triage
# reason. Then the rules ty turns off by default that this file turns on.
# Then the rules ty already enables, alphabetical, without comments.
#
# Copy this table as-is:
#   - into a project's own `ty.toml` (as the top-level `[rules]` table), or
#   - into `pyproject.toml` under `[tool.ty.rules]` (rename the table header,
#     keep every line).
#
# Last triaged against: ty 0.0.103 (152 rules: 107 error-by-default,
# 27 warn-by-default, 18 ignore-by-default).
#
# Re-check the copied table after every ty version bump:
#   python-linters check-config ty <path/to/ty.toml>
# It reports rules ty knows that the table omits (untriaged) and rules the
# table names that ty no longer knows (stale), and exits non-zero on either.
# ============================================================================

[rules]

# --- Ignored rules: each carries its triage reason -------------------------

# not applicable: checks PEP 484's legacy `__`-prefixed positional-only
# parameters, obsolete since PEP 570's `/` (Python 3.8).
invalid-legacy-positional-parameter = "ignore"

# not applicable: a no-op unless `TY_UV=1` is set and uv >= 0.12 supplies
# dependency metadata. Re-triage when a project opts in.
missing-direct-dependency = "ignore"

# false positives: ty's flow narrowing ignores a concurrent task mutating an
# instance attribute across an `await`. So it reports a check on that
# attribute after the `await` as always true or always false.
redundant-condition-strict = "ignore"

# false positives: ty infers an empty literal (`[]`, `{}`, `set()`) as
# `list[Unknown]` etc. and rejects it against `Sequence`, `Mapping`,
# `AbstractSet`. The only per-site fix is code shaped for the checker
# (`list[Path]()` instead of `[]`), and code never changes only because ty
# cannot infer a type.
# cost: an `Any` reaching a typed name (argparse attributes,
# `re.Match.group()`) goes unflagged.
# Re-triage on each ty bump: ty is 0.0.x and its inference changes.
unsound-assignment = "ignore"
unsound-return = "ignore"
unsound-yield = "ignore"

# not applicable: checks classes built with `type()`, which the doctrine
# does not use. Astral calls the rule noisy on dynamic `type()` code.
unsupported-dynamic-base = "ignore"

# --- Enabled although off by default in ty --------------------------------

# off by default for false-positive volume. On here until a triage shows
# that volume, then they move to the ignored section with the evidence.
division-by-zero = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"

# opt-in strictness: astral keeps these off as stricter than most projects
# want. This file wants that strictness.
blanket-ignore-comment = "error"
disjoint-cast = "error"
dynamic-function-decorator-return = "error"
mismatched-sentinel-name = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
truthiness-test-of-none-union = "error"

